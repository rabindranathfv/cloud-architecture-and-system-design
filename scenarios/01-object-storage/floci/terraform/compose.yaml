name: object-storage-floci-terraform

services:
  floci:
    image: floci/floci:latest@sha256:a0fbf944d7f338cc0856f1ef83831ea749ff2be71956eb7a7fce08fc21458e19
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data

volumes:
  floci-data:
